name: unny

services:
  postgres:
    image: postgres:16-alpine
    container_name: unny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unny_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unny_pass}
      POSTGRES_DB: ${POSTGRES_DB:-unny}
    volumes:
      - unny-pgdata:/var/lib/postgresql/data
    ports:
      # Exposed on the host only so you can point a GUI client (TablePlus,
      # DBeaver, `prisma studio` run from the host) at it. Remove this
      # mapping if you never need external DB access.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unny_user} -d ${POSTGRES_DB:-unny}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - unny-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: unny-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Inside the compose network, the DB host is the service name
      # "postgres", never "localhost" — this is the #1 thing people forget
      # to change when moving from the manual setup guide into Docker.
      DATABASE_URL: postgresql://${POSTGRES_USER:-unny_user}:${POSTGRES_PASSWORD:-unny_pass}@postgres:5432/${POSTGRES_DB:-unny}?schema=public
    ports:
      - "${APP_HOST_PORT:-5000}:5000"
    volumes:
      # Persists local-disk uploads (used automatically whenever AWS_* is
      # blank — see src/services/storage.service.js) across restarts.
      - unny-uploads:/app/storage/uploads
    networks:
      - unny-net

volumes:
  unny-pgdata:
  unny-uploads:

networks:
  unny-net:
    driver: bridge
